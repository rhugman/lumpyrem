[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "lumpyrem"
version = "0.0.1"
description = "Lumped-parameter recharge modelling, a Python port of LUMPREM"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
dependencies = ["numpy>=1.24", "pandas>=2.0"]

[project.optional-dependencies]
# Numba's supported NumPy ceiling is why this is pinned; see docs/conversion-plan.md
# section 7.  Without it the package still runs, on the pure-Python kernel.
fast = ["numba>=0.60", "numpy<2.4"]
plot = ["matplotlib>=3.7"]
# lumpyrem.io: gridded forcing and results as xarray Datasets and netCDF.
xarray = ["xarray>=2024.6", "netCDF4>=1.6"]
test = ["pytest>=7", "matplotlib>=3.7", "xarray>=2024.6", "netCDF4>=1.6"]
dev = ["pytest>=7", "ruff>=0.6", "matplotlib>=3.7", "xarray>=2024.6", "netCDF4>=1.6"]

[tool.hatch.build.targets.wheel]
packages = ["src/lumpyrem"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["tests", "src"]
addopts = "-ra --strict-markers"
markers = ["oracle: requires gfortran to build the reference implementation"]

[tool.ruff]
line-length = 100
src = ["src", "tests", "scripts"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "NPY"]

[tool.ruff.lint.per-file-ignores]
# The oracle fixtures mirror the Fortran variable names on purpose, and
# LUMPREM's pore-size parameter really is called "l".
"tests/oracle/*" = ["E741"]
# core.py is a literal translation held to bit-fidelity. It keeps the Fortran's
# parameter names and its nested branch structure so the correspondence stays
# checkable line by line; collapsing the nesting would hide it.
"src/lumpyrem/core.py" = ["E741", "SIM102"]
# compiled.py is the same translation in a form Numba accepts, held to the same
# gate, so it keeps the same shape for the same reason.
"src/lumpyrem/compiled.py" = ["E741", "SIM102"]
# engine.py packs and unpacks the kernel's parameters under the kernel's names.
"src/lumpyrem/engine.py" = ["E741"]
# "l" is what both manuals and the soil-physics literature call the Mualem
# pore-connectivity exponent; renaming it in the public API would cost more
# than it saves.
"src/lumpyrem/parameters.py" = ["E741"]
"tests/api_compare.py" = ["E741"]
