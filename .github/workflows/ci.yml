name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    name: ${{ matrix.os }} / py${{ matrix.python }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        python: ["3.12"]

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}

      # gfortran is preinstalled on the Ubuntu and macOS runners; Windows
      # needs it from the MSYS2/mingw toolchain.
      - name: Install gfortran (Windows)
        if: runner.os == 'Windows'
        uses: msys2/setup-msys2@v2
        with:
          msystem: MINGW64
          install: mingw-w64-x86_64-gcc-fortran
          path-type: inherit

      - name: Add mingw to PATH (Windows)
        if: runner.os == 'Windows'
        run: echo "D:/a/_temp/msys64/mingw64/bin" >> $env:GITHUB_PATH

      - name: Check gfortran
        run: gfortran --version

      - name: Install
        run: python -m pip install -e ".[dev]"

      - name: Lint
        run: ruff check .

      - name: Test
        run: pytest -q

      # The Phase 0 gate: golden files must come back identical from a clean
      # checkout.  Byte-identity is required on the platform that generated
      # them; elsewhere the ULP budget in tests/test_golden.py applies.
      - name: Regenerate golden files
        run: python scripts/generate_golden.py --check
