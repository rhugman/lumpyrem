name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    name: ${{ matrix.os }} / py${{ matrix.python }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        python: ["3.12"]

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}

      # gfortran is preinstalled on the Ubuntu runner and, as gfortran-NN, on
      # the macOS one; Windows needs it from MSYS2.  UCRT64 rather than the
      # deprecated MINGW64: it links the same C runtime CPython does, which is
      # the best chance of Python and the Fortran sharing exp and **.  The
      # maths probe in tests/reference.py decides whether they actually do.
      - name: Install gfortran (Windows)
        if: runner.os == 'Windows'
        uses: msys2/setup-msys2@v2
        with:
          msystem: UCRT64
          install: mingw-w64-ucrt-x86_64-gcc-fortran
          path-type: inherit

      - name: Add mingw to PATH (Windows)
        if: runner.os == 'Windows'
        run: echo "D:/a/_temp/msys64/ucrt64/bin" >> $env:GITHUB_PATH

      # The macOS image carries Homebrew GCC only as gfortran-NN; there is no
      # plain gfortran on the PATH.  Link the newest one, installing GCC if the
      # image ever stops shipping it.
      - name: Link gfortran (macOS)
        if: runner.os == 'macOS'
        run: |
          fc=$(ls "$(brew --prefix)"/bin/gfortran-* 2>/dev/null | grep -E 'gfortran-[0-9]+$' | sort -V | tail -1)
          if [ -z "$fc" ]; then
            brew install gcc
            fc=$(ls "$(brew --prefix)"/bin/gfortran-* | grep -E 'gfortran-[0-9]+$' | sort -V | tail -1)
          fi
          ln -sf "$fc" "$(brew --prefix)/bin/gfortran"

      - name: Check gfortran
        run: gfortran --version

      # "fast" brings Numba, and with it the numpy<2.4 pin, so the compiled
      # kernel is gated alongside the pure-Python one rather than skipped.
      - name: Install
        run: python -m pip install -e ".[dev,fast]"

      - name: Lint
        run: ruff check .

      # The measurement the cross-platform ULP budget was waiting for.  It never
      # fails the job: it runs before the tests so that its numbers exist even
      # when the gate they inform does not pass.
      - name: Cross-platform report
        continue-on-error: true
        run: python scripts/crossplatform_report.py --json crossplatform-${{ matrix.os }}.json

      - name: Upload cross-platform report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: crossplatform-${{ matrix.os }}
          path: crossplatform-${{ matrix.os }}.json
          if-no-files-found: ignore

      - name: Test
        run: pytest -q

      # The Phase 0 gate: golden files must come back byte-identical from a
      # clean checkout, which only the platform that generated them can do.
      # Elsewhere tests/test_golden.py holds them to the tolerance regime.
      - name: Regenerate golden files
        if: runner.os == 'macOS'
        run: python scripts/generate_golden.py --check
